<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель SkyMail</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #0a0f1e;
      color: #e0e8ff;
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .container { max-width: 1400px; margin:0 auto; }
    h1 {
      color: #b7ceff;
      border-left: 4px solid #5f7ecf;
      padding-left: 1rem;
      margin-bottom: 2rem;
      font-weight: 300;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .stat-card {
      background: #1a233a;
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #2a3450;
    }
    .stat-number {
      font-size: 2rem;
      font-weight: bold;
      color: #b7ceff;
    }
    .stat-label {
      font-size: 0.8rem;
      color: #8899cc;
    }
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1.5rem;
      background: #1a233a;
      border: 1px solid #2a3450;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }
    .tab.active {
      background: #5f7ecf;
      border-color: #5f7ecf;
    }
    .tab:hover {
      background: #2a3450;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a233a;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 0.7rem;
      text-align: left;
      border-bottom: 1px solid #2a3450;
      word-break: break-word;
    }
    th {
      background: #0d1425;
      color: #b7ceff;
      font-weight: 600;
    }
    .btn {
      padding: 0.3rem 0.8rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: 0.2s;
    }
    .btn:hover {
      opacity: 0.8;
    }
    .btn-danger { background: #c44; color: white; }
    .btn-success { background: #2a7a2a; color: white; }
    .btn-sm { padding: 0.2rem 0.6rem; font-size: 0.7rem; }
    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: #5f7ecf;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }
    .login-warning {
      background: #3a2a1a;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      border-left: 4px solid #f48024;
    }
    .login-warning input {
      background: #0d1225;
      border: 1px solid #2a3450;
      color: white;
      padding: 0.5rem;
      border-radius: 6px;
      margin: 0.3rem 0;
      width: 200px;
    }
    .login-warning button {
      background: #5f7ecf;
      border: none;
      color: white;
      padding: 0.5rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 0.5rem;
    }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1a233a;
      color: #e0e8ff;
      padding: 0.8rem 2rem;
      border-radius: 12px;
      border: 1px solid #2a3450;
      z-index: 100;
      display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .toast.error { border-color: #c44; }
    .toast.success { border-color: #2a7a2a; }
    .status-msg { color: #8899cc; padding: 1rem; text-align: center; }
    .loading { text-align: center; color: #8899cc; padding: 1rem; }
    @media (max-width: 768px) {
      body { padding: 1rem; }
      .stats { grid-template-columns: 1fr 1fr; }
      table { font-size: 0.8rem; }
      th, td { padding: 0.4rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛡️ Админ-панель SkyMail</h1>
    <div id="adminStatus"></div>

    <!-- Статистика -->
    <div class="stats" id="statsContainer">
      <div class="stat-card"><div class="stat-number" id="statUsers">-</div><div class="stat-label">Пользователей</div></div>
      <div class="stat-card"><div class="stat-number" id="statBanned">-</div><div class="stat-label">Забанено IP</div></div>
    </div>

    <!-- Вкладки -->
    <div class="tabs" id="tabs">
      <button class="tab active" data-tab="users">👥 Пользователи</button>
      <button class="tab" data-tab="violations">🚫 Нарушения</button>
    </div>

    <!-- Содержимое вкладок -->
    <div id="tab-users" class="tab-content active">
      <div id="usersTableWrap"><div class="loading">Загрузка...</div></div>
    </div>
    <div id="tab-violations" class="tab-content">
      <div id="violationsTableWrap"><div class="loading">Загрузка...</div></div>
    </div>

    <a href="/" class="back-link">🏰 Вернуться на почту</a>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script>
    // ====== КОНФИГУРАЦИЯ ======
    const API_URL = '';
    let token = localStorage.getItem('skymail_token') || null;

    // ====== ТОСТ ======
    function showToast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast ' + type;
      el.style.display = 'block';
      clearTimeout(el._timer);
      el._timer = setTimeout(() => { el.style.display = 'none'; }, 4000);
    }

    // ====== API-ЗАПРОСЫ ======
    async function fetchAdmin(endpoint, options = {}) {
      const headers = {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        ...options.headers
      };
      const res = await fetch(endpoint, { ...options, headers });
      if (res.status === 401 || res.status === 403) {
        throw new Error('Unauthorized or Forbidden');
      }
      if (!res.ok) {
        const text = await res.text();
        throw new Error(`HTTP ${res.status}: ${text.slice(0, 100)}`);
      }
      return res.json();
    }

    // ====== ПРОВЕРКА АДМИНА ======
    async function checkAdmin() {
      const statusDiv = document.getElementById('adminStatus');
      if (!token) {
        statusDiv.innerHTML = `
          <div class="login-warning">
            ⚠️ Вы не авторизованы.
            <button onclick="showLoginForm()">Войти как администратор</button>
          </div>
        `;
        return false;
      }
      try {
        const res = await fetch('/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ token })
        });
        if (!res.ok) throw new Error('Invalid token');
        const data = await res.json();
        if (data.username !== 'SkyMonder') {
          statusDiv.innerHTML = `<div class="login-warning">⚠️ У вас нет прав администратора. Доступ запрещён.</div>`;
          return false;
        }
        statusDiv.innerHTML = `<div style="color:#7ebc6f;">✅ Вы вошли как администратор (${data.username})</div>`;
        return true;
      } catch (e) {
        statusDiv.innerHTML = `
          <div class="login-warning">
            ⚠️ Ошибка авторизации (${e.message}).
            <button onclick="showLoginForm()">Войти заново</button>
          </div>
        `;
        return false;
      }
    }

    // ====== ФОРМА ВХОДА ======
    function showLoginForm() {
      const statusDiv = document.getElementById('adminStatus');
      statusDiv.innerHTML = `
        <div class="login-warning">
          <p><strong>Вход в админ-панель</strong></p>
          <input type="text" id="adminLoginInput" placeholder="Логин" style="background:#0d1225;border:1px solid #2a3450;color:white;padding:0.5rem;border-radius:6px;width:200px;margin:0.3rem 0;">
          <br>
          <input type="password" id="adminPassInput" placeholder="Пароль" style="background:#0d1225;border:1px solid #2a3450;color:white;padding:0.5rem;border-radius:6px;width:200px;margin:0.3rem 0;">
          <br>
          <button onclick="loginAdmin()" style="background:#5f7ecf;border:none;color:white;padding:0.5rem 1.5rem;border-radius:6px;cursor:pointer;margin-top:0.5rem;">Войти</button>
          <button onclick="location.reload()" style="background:#444;border:none;color:white;padding:0.5rem 1.5rem;border-radius:6px;cursor:pointer;margin-top:0.5rem;margin-left:0.5rem;">Отмена</button>
        </div>
      `;
    }

    async function loginAdmin() {
      const login = document.getElementById('adminLoginInput').value.trim();
      const password = document.getElementById('adminPassInput').value;
      if (!login || !password) { showToast('Заполните все поля', 'error'); return; }
      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: login, password })
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || 'Ошибка входа');
        }
        const data = await res.json();
        token = data.jwt || data.token;
        localStorage.setItem('skymail_token', token);
        showToast('✅ Вход выполнен', 'success');
        location.reload();
      } catch (e) {
        showToast('❌ Ошибка: ' + e.message, 'error');
      }
    }

    // ====== ЗАГРУЗКА СТАТИСТИКИ ======
    async function loadStats() {
      try {
        const stats = await fetchAdmin('/admin/stats');
        document.getElementById('statUsers').textContent = stats.users || 0;
        document.getElementById('statBanned').textContent = stats.banned || 0;
      } catch (e) {
        console.warn('Статистика не загружена:', e);
      }
    }

    // ====== ЗАГРУЗКА ПОЛЬЗОВАТЕЛЕЙ ======
    async function loadUsers() {
      const wrap = document.getElementById('usersTableWrap');
      try {
        const users = await fetchAdmin('/admin/users');
        if (!users.length) { wrap.innerHTML = '<p class="status-msg">Нет пользователей</p>'; return; }
        let html = `<table><tr><th>Логин</th><th>Действия</th></tr>`;
        users.forEach(u => {
          html += `<tr>
            <td>${escapeHtml(u.username)}</td>
            <td>
              ${u.username !== 'SkyMonder' ? `<button class="btn btn-danger btn-sm" onclick="banUser('${u.username}')">Забанить</button>` : ''}
            </td>
          </tr>`;
        });
        html += '</table>';
        wrap.innerHTML = html;
      } catch (e) {
        wrap.innerHTML = `<p style="color:#c44;">❌ Ошибка: ${e.message}</p>`;
      }
    }

    window.banUser = async (username) => {
      if (!confirm(`Забанить пользователя ${username}?`)) return;
      try {
        // Здесь можно добавить логику бана пользователя, но пока просто сообщаем
        showToast(`✅ Пользователь ${username} забанен`, 'success');
        loadUsers();
      } catch (e) {
        showToast('❌ Ошибка: ' + e.message, 'error');
      }
    };

    // ====== ЗАГРУЗКА НАРУШЕНИЙ ======
    async function loadViolations() {
      const wrap = document.getElementById('violationsTableWrap');
      try {
        const data = await fetchAdmin('/admin/violations');
        if (!data.length) { wrap.innerHTML = '<p class="status-msg">Нет нарушений</p>'; return; }
        let html = `<table><tr><th>IP</th><th>Причина</th><th>Время</th><th>Действие</th></tr>`;
        data.forEach(v => {
          html += `<tr>
            <td>${escapeHtml(v.ip)}</td>
            <td>${escapeHtml(v.message || 'Нарушение правил')}</td>
            <td>${new Date(v.bannedAt).toLocaleString()}</td>
            <td><button class="btn btn-success btn-sm" onclick="unbanIP('${v.ip}')">Разбан</button></td>
          </tr>`;
        });
        html += '</table>';
        wrap.innerHTML = html;
      } catch (e) {
        wrap.innerHTML = `<p style="color:#c44;">❌ Ошибка: ${e.message}</p>`;
      }
    }

    window.unbanIP = async (ip) => {
      if (!confirm(`Разблокировать IP ${ip}?`)) return;
      try {
        await fetchAdmin('/admin/unban', {
          method: 'POST',
          body: JSON.stringify({ ip })
        });
        showToast(`✅ IP ${ip} разблокирован`, 'success');
        loadViolations();
        loadStats();
      } catch (e) {
        showToast('❌ Ошибка: ' + e.message, 'error');
      }
    };

    // ====== ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ======
    function initTabs() {
      const tabs = document.querySelectorAll('.tab');
      const contents = {
        users: document.getElementById('tab-users'),
        violations: document.getElementById('tab-violations')
      };
      const loaders = {
        users: loadUsers,
        violations: loadViolations
      };

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          const target = tab.dataset.tab;
          Object.keys(contents).forEach(key => {
            contents[key].classList.toggle('active', key === target);
          });
          if (loaders[target]) loaders[target]();
        });
      });

      // Первая вкладка уже активна, загружаем её
      loadUsers();
    }

    // ====== ВСПОМОГАТЕЛЬНЫЕ ======
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;',
        '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    (async function init() {
      const isAdmin = await checkAdmin();
      if (!isAdmin) {
        document.querySelector('.stats').style.opacity = '0.4';
        document.querySelector('.tabs').style.pointerEvents = 'none';
        document.querySelectorAll('.tab-content').forEach(el => el.style.opacity = '0.4');
        return;
      }
      loadStats();
      initTabs();
    })();
  </script>
</body>
</html>
