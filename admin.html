<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель SkyMail</title>
    <!-- Bootstrap 5 + иконки -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f7fa; }
        .stat-card { transition: 0.3s; border: none; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.08); }
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 0.75rem 1.5rem rgba(0,0,0,0.12); }
        .stat-icon { font-size: 2.5rem; opacity: 0.7; }
        .table-violations td { vertical-align: middle; }
        .admin-header { background: white; border-bottom: 2px solid #e9ecef; padding: 1rem 0; }
        .logout-btn { cursor: pointer; }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header class="admin-header mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h4 mb-0"><i class="bi bi-shield-lock-fill text-primary me-2"></i>Админ-панель SkyMail</h1>
            <div>
                <a href="/" class="btn btn-outline-secondary btn-sm me-2"><i class="bi bi-envelope"></i> На почту</a>
                <button id="logoutBtn" class="btn btn-outline-danger btn-sm logout-btn"><i class="bi bi-box-arrow-right"></i> Выйти</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Статистика -->
        <div class="row g-4 mb-4" id="statsRow">
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-people stat-icon text-primary me-3"></i>
                        <div>
                            <h6 class="card-subtitle text-muted">Пользователей</h6>
                            <span class="display-6" id="usersCount">—</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-shield-slash stat-icon text-danger me-3"></i>
                        <div>
                            <h6 class="card-subtitle text-muted">Забанено IP</h6>
                            <span class="display-6" id="bannedCount">—</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card stat-card">
                    <div class="card-body d-flex align-items-center">
                        <i class="bi bi-clock-history stat-icon text-warning me-3"></i>
                        <div>
                            <h6 class="card-subtitle text-muted">Последний бан</h6>
                            <span class="fs-6" id="lastBan">—</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Список нарушений -->
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-exclamation-triangle-fill text-warning me-2"></i>Нарушения</h5>
                <span class="badge bg-secondary" id="violationsCount">0</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-violations mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>IP-адрес</th>
                                <th>Причина</th>
                                <th>Дата бана</th>
                                <th class="text-end">Действие</th>
                            </tr>
                        </thead>
                        <tbody id="violationsBody">
                            <tr><td colspan="4" class="text-center text-muted py-4">Загрузка...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Тосты для уведомлений -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1050;">
        <div id="toastContainer" class="toast-container"></div>
    </div>

    <script>
        'use strict';

        // --- Вспомогательные функции ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast align-items-center text-white bg-${type} border-0`;
            toast.role = 'alert';
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">${message}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            container.appendChild(toast);
            const bsToast = new bootstrap.Toast(toast, { delay: 4000 });
            bsToast.show();
            toast.addEventListener('hidden.bs.toast', () => toast.remove());
        }

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                credentials: 'include', // отправляем куки сессии
                headers: {
                    'Content-Type': 'application/json',
                    ...(options.headers || {})
                }
            });
            if (!response.ok) {
                let errorMsg = `Ошибка ${response.status}`;
                try {
                    const errData = await response.json();
                    errorMsg = errData.error || errData.message || errorMsg;
                } catch (e) {}
                throw new Error(errorMsg);
            }
            return response.json();
        }

        function formatDate(ts) {
            if (!ts) return '—';
            return new Date(ts).toLocaleString('ru-RU', {
                day: '2-digit', month: '2-digit', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // --- Загрузка данных ---
        async function loadStats() {
            try {
                const stats = await apiFetch('/admin/stats');
                document.getElementById('usersCount').textContent = stats.users ?? 0;
                document.getElementById('bannedCount').textContent = stats.banned ?? 0;
            } catch (err) {
                console.error('Stats error:', err);
                document.getElementById('usersCount').textContent = '❌';
                document.getElementById('bannedCount').textContent = '❌';
                showToast('Не удалось загрузить статистику', 'danger');
            }
        }

        async function loadViolations() {
            try {
                const data = await apiFetch('/admin/violations');
                const tbody = document.getElementById('violationsBody');
                document.getElementById('violationsCount').textContent = data.length;

                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="text-center text-muted py-4">Нет нарушений</td></tr>`;
                    document.getElementById('lastBan').textContent = '—';
                    return;
                }

                // Последний бан
                const sorted = [...data].sort((a, b) => b.bannedAt - a.bannedAt);
                document.getElementById('lastBan').textContent = formatDate(sorted[0].bannedAt);

                let html = '';
                data.forEach(item => {
                    html += `
                        <tr>
                            <td><code>${escapeHtml(item.ip)}</code></td>
                            <td>${escapeHtml(item.reason || 'Не указана')}</td>
                            <td>${formatDate(item.bannedAt)}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-danger unban-btn" data-ip="${escapeHtml(item.ip)}">
                                    <i class="bi bi-arrow-counterclockwise"></i> Разбанить
                                </button>
                            </td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

                // Обработчики для кнопок разбана
                document.querySelectorAll('.unban-btn').forEach(btn => {
                    btn.addEventListener('click', handleUnban);
                });
            } catch (err) {
                console.error('Violations error:', err);
                document.getElementById('violationsBody').innerHTML =
                    `<tr><td colspan="4" class="text-center text-danger py-4">Ошибка загрузки нарушений</td></tr>`;
                showToast('Не удалось загрузить список нарушений', 'danger');
            }
        }

        // --- Разбан ---
        async function handleUnban(e) {
            const btn = e.currentTarget;
            const ip = btn.dataset.ip;
            if (!ip) return;

            if (!confirm(`Разбанить IP-адрес ${ip}?`)) return;

            try {
                await apiFetch('/admin/unban', {
                    method: 'POST',
                    body: JSON.stringify({ ip })
                });
                showToast(`IP ${ip} успешно разбанен`, 'success');
                // Обновляем данные
                await loadViolations();
                await loadStats();
            } catch (err) {
                showToast(err.message, 'danger');
            }
        }

        // --- Выход ---
        document.getElementById('logoutBtn').addEventListener('click', async function() {
            try {
                await apiFetch('/logout', { method: 'GET' });
                window.location.href = '/'; // редирект на главную
            } catch (err) {
                showToast('Ошибка выхода: ' + err.message, 'danger');
            }
        });

        // --- Проверка авторизации администратора ---
        // Делаем пробный запрос; если 403 – редирект на главную
        async function checkAdmin() {
            try {
                await apiFetch('/admin/stats');
                // Если успешно – загружаем данные
                await loadStats();
                await loadViolations();
            } catch (err) {
                // Если ошибка 403 или 401 – редирект
                if (err.message.includes('403') || err.message.includes('401')) {
                    showToast('У вас нет прав администратора', 'warning');
                    setTimeout(() => { window.location.href = '/'; }, 1500);
                } else {
                    // Другая ошибка – показываем, но даём возможность попробовать снова
                    showToast('Ошибка подключения: ' + err.message, 'danger');
                }
            }
        }

        // --- Запуск ---
        checkAdmin();

        // Экранирование для защиты от XSS
        function escapeHtml(str) {
            if (!str) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return str.replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        // Импортируем Bootstrap для тостов (нужен для создания экземпляра Toast)
        // Bootstrap уже загружен, но мы используем глобальный объект bootstrap
        // Чтобы не было ошибок, убедимся, что он есть
        if (typeof bootstrap === 'undefined') {
            // Загрузим Bootstrap JS динамически (маловероятно, но на всякий случай)
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js';
            document.head.appendChild(script);
        }
    </script>
</body>
</html>
